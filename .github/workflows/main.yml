name: 'Tencent Video Auto Check-in'
on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 0 * * *'  # UTC 00:15 = 北京时间 08:15
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run check-in
        run: |
          python main.py >> run.log
        env:
          LOGIN_COOKIE: ${{ secrets.LOGIN_COOKIE }}
          AUTH_COOKIE: ${{ secrets.AUTH_COOKIE }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      
      - name: Append Success Log
        run: |
          echo "$(date +%Y-%m-%d\ %H:%M:%S) - 签到完成" >> run.log
      
      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: run.log
      
      - name: Push log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: auto-checkin
          branch: main
